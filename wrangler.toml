# La porta di JJA-VIS: riceve le risposte della pagina pubblica.
# Stesso account di Hermes: il numero si legge nell'indirizzo della
# dashboard, non e' una password.
account_id = "a7b689d44126744a37ccb1215746ee8b"
name = "jjavis-porta"
main = "worker.js"
compatibility_date = "2026-09-25"
workers_dev = true
preview_urls = false

# I freni della chat sulla pagina (/parla): per persona e per tutti.
# Contatori approssimati, per sede di Cloudflare: servono contro l'abuso,
# non sono un conto esatto.
[[ratelimits]]
name = "FRENO_PERSONA"
namespace_id = "7301"
[ratelimits.simple]
limit = 6
period = 60

[[ratelimits]]
name = "FRENO_TUTTI"
namespace_id = "7302"
[ratelimits.simple]
limit = 40
period = 60
