# Il server della città di JJA-VIS: chi è in città vede gli altri (JJ, 5 ottobre 2026: «non è una piazza... è la città»).
# Account di JJA-VIS (JJ, 5/10: contatori separati da Hermes e Clio), piano gratuito: i Durable Objects
# del piano gratuito sono solo quelli con SQLite (new_sqlite_classes).
# account_id: non qui. Lo passa la consegna (CLOUDFLARE_ACCOUNT_ID dal segreto CF_AI_ACCOUNT): è l account di JJA-VIS, non quello di Hermes e Clio (JJ, 5/10)
name = "jjavis-citta"
main = "worker.js"
compatibility_date = "2026-09-25"
workers_dev = true
preview_urls = false

[[durable_objects.bindings]]
name = "CITTA"
class_name = "Citta"

[[durable_objects.bindings]]
name = "CONTI"
class_name = "Conti"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Citta"]

# 5/10: gli account (accedi con Google), col loro database
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Conti"]

[vars]
# l'ID client di Google (progetto «JJA-VIS» di JJ): non è un segreto, sta anche nella pagina
GOOGLE_CLIENT_ID = "644831505498-sb1lrkalu9maun2f8vcv2e7l3au31akm.apps.googleusercontent.com"
# JJAVIS_ADMIN (la mail dell'amministratore) è un segreto: lo mette la consegna, dai Secrets del repository
