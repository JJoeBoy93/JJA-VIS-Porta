# Consegna della porta su Cloudflare. Repository pubblico: i minuti di
# Actions qui non si pagano.
#
# Secrets di QUESTO repository (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  lo stesso di Ardito-Hermes                 obbligatorio
#   VOCI_TOKEN            token a grana fine, solo JJA-VIS-Voci,     obbligatorio
#                         Contents in scrittura → su Cloudflare come GH_TOKEN
#   TG_BOT_TOKEN          il bot di JJA-VIS (non quello di JARVIS)   per le risposte
#   TG_CHAT               il numero che il bot ti dice al primo messaggio
#   ANTHROPIC_API_KEY     una chiave SOLO per JJA-VIS                per le bozze
#   BREVO_API_KEY         la chiave API di Brevo (non quella SMTP)   per mandare
#   MITTENTE              la mail di JJA-VIS verificata su Brevo
#   TG_GRUPPO             il supergruppo con gli Argomenti: una persona per argomento
#   TG_OLIMPO             il supergruppo «JJA-VIS Olimpo»: un argomento per agente (24/10)
# Quelli che mancano non si inventano: la porta li elenca su GET /.
name: consegna porta

on:
  push:
    branches: [main]
    paths-ignore: ["citta/**", ".github/workflows/citta.yml"]   # il server della città ha la sua consegna
  workflow_dispatch:

permissions: { contents: write }

jobs:
  consegna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: "le prove della porta (tutte finte, non parte niente di vero)"
        # 10/10: le prove c'erano ma la consegna non le faceva girare. Ora se una è rossa la porta non si consegna
        run: |
          rossi=""
          for f in collaudo/*.mjs; do node "$f" > prova.log 2>&1 || rossi="$rossi $f: $(grep -m2 '❌\|NO ' prova.log | tr '\n' '|' | cut -c1-200)"; done
          if [ -n "$rossi" ]; then echo "::error::prove rosse, niente consegna —$rossi"; exit 1; fi
          echo "::notice::prove della porta tutte verdi"

      # Persefone (23/10): il magazzino dove ricorda chi ha già sondato oggi. Passo a sé: se non riesce, Persefone avvisa a ogni
      # colpo ma la consegna va avanti (continue-on-error). Creato una volta, l'id resta nel wrangler.toml e dopo questo passo non fa niente.
      #
      # 23/10 pomeriggio — rifatto: prima usava `wrangler kv namespace create` e, se il token non aveva il permesso KV, usciva
      # SENZA id e il passo diceva solo «non creato» — un guasto muto (non si capiva se mancava il permesso o altro). Ora chiama
      # l'API di Cloudflare direttamente: l'id si legge in JSON e un permesso mancante dà un messaggio esplicito, non il silenzio.
      - name: il magazzino di Persefone
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if grep -q 'binding = "PERSEFONE_VISTI"' wrangler.toml; then echo "c'è già, non faccio niente"; exit 0; fi
          ACCOUNT=$(grep -oE 'account_id = "[0-9a-f]{32}"' wrangler.toml | grep -oE '[0-9a-f]{32}')
          echo "account $ACCOUNT"
          RISP=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/storage/kv/namespaces" \
                 -H "Authorization: Bearer $CF_TOKEN" -H "content-type: application/json" \
                 --data '{"title":"PERSEFONE_VISTI"}')
          echo "$RISP" | head -c 600; echo
          OK=$(echo "$RISP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('success'))" 2>/dev/null)
          ID=$(echo "$RISP" | python3 -c "import json,sys; print((json.load(sys.stdin).get('result') or {}).get('id',''))" 2>/dev/null)
          if [ "$OK" = "True" ] && [ -n "$ID" ]; then
            printf '\n[[kv_namespaces]]\nbinding = "PERSEFONE_VISTI"\nid = "%s"\n' "$ID" >> wrangler.toml
            git config user.name Athena; git config user.email athena@jja-vis.local
            git add wrangler.toml && git commit -qm "Persefone: id del magazzino PERSEFONE_VISTI nel wrangler.toml" && git push -q origin HEAD:main || echo "commit saltato"
            echo "::notice::magazzino di Persefone creato: $ID — la prossima consegna lo userà"
          else
            # se il titolo esiste già da un tentativo andato a metà, riuso quell'id invece di restare senza
            ESISTE=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/storage/kv/namespaces?per_page=100" \
                     -H "Authorization: Bearer $CF_TOKEN" | python3 -c "import json,sys; print(next((n['id'] for n in (json.load(sys.stdin).get('result') or []) if n.get('title')=='PERSEFONE_VISTI'),''))" 2>/dev/null)
            if [ -n "$ESISTE" ]; then
              printf '\n[[kv_namespaces]]\nbinding = "PERSEFONE_VISTI"\nid = "%s"\n' "$ESISTE" >> wrangler.toml
              git config user.name Athena; git config user.email athena@jja-vis.local
              git add wrangler.toml && git commit -qm "Persefone: riuso l'id del magazzino già esistente" && git push -q origin HEAD:main || echo "commit saltato"
              echo "::notice::magazzino di Persefone già esistente, riusato: $ESISTE"
            else
              ERR=$(echo "$RISP" | python3 -c "import json,sys; e=json.load(sys.stdin).get('errors') or []; print(e[0].get('message','?') if e else '?')" 2>/dev/null)
              echo "::warning::magazzino di Persefone NON creato — Cloudflare dice: ${ERR}. Se è un permesso mancante, al token CLOUDFLARE_API_TOKEN serve «Workers KV Storage: Edit». Intanto Persefone avvisa a ogni colpo, ma protegge."
            fi
          fi

      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::manca CLOUDFLARE_API_TOKEN nei Secrets del repository"; exit 1; fi
          if npx --yes wrangler@4.149.0 deploy 2>&1 | tee consegna.log; then
            echo "::notice::$(tail -c 500 consegna.log | tr '\n' '|')"
          else
            echo "::error::$(tail -c 900 consegna.log | tr '\n' '|')"
            exit 1
          fi


      - name: i segreti della porta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN_V: ${{ secrets.VOCI_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MITTENTE: ${{ secrets.MITTENTE }}
          TG_GRUPPO: ${{ secrets.TG_GRUPPO }}
          TG_OLIMPO: ${{ secrets.TG_OLIMPO }}
          JJAVIS_SEGRETO: ${{ secrets.JJAVIS_SEGRETO }}
          ORS_KEY: ${{ secrets.ORS_KEY }}
          DOC_CHIAVE: ${{ secrets.DOC_CHIAVE }}
          PARTENZA: ${{ secrets.PARTENZA }}
          GOOGLE_SA: ${{ secrets.GOOGLE_SA }}
          CAL_JJ: ${{ secrets.CAL_JJ }}
          CAL_ATHENA: ${{ secrets.CAL_ATHENA }}
          IBAN: ${{ secrets.IBAN }}
          CF_AI_ACCOUNT: ${{ secrets.CF_AI_ACCOUNT }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          CLIO_CHIAVE: ${{ secrets.CLIO_CHIAVE }}
        run: |
          set -o pipefail
          if [ -z "$GH_TOKEN_V" ]; then echo "::error::manca VOCI_TOKEN: la porta e' accesa ma non puo' salvare"; exit 1; fi
          python3 - <<'PY'
          import json, os
          nomi = {"GH_TOKEN": "GH_TOKEN_V", "TG_BOT_TOKEN": "TG_BOT_TOKEN", "TG_CHAT": "TG_CHAT",
                  "ANTHROPIC_API_KEY": "ANTHROPIC_API_KEY", "BREVO_API_KEY": "BREVO_API_KEY", "MITTENTE": "MITTENTE", "TG_GRUPPO": "TG_GRUPPO", "TG_OLIMPO": "TG_OLIMPO", "JJAVIS_SEGRETO": "JJAVIS_SEGRETO", "ORS_KEY": "ORS_KEY", "DOC_CHIAVE": "DOC_CHIAVE", "PARTENZA": "PARTENZA", "GOOGLE_SA": "GOOGLE_SA", "CAL_JJ": "CAL_JJ", "CAL_ATHENA": "CAL_ATHENA", "IBAN": "IBAN", "CF_AI_ACCOUNT": "CF_AI_ACCOUNT", "CF_AI_TOKEN": "CF_AI_TOKEN", "CLIO_CHIAVE": "CLIO_CHIAVE"}
          d = {k: os.environ[v].strip() for k, v in nomi.items() if os.environ.get(v, "").strip()}
          mancano = [k for k in nomi if k not in d]
          json.dump(d, open("/tmp/segreti.json", "w"))
          print("::notice::segreti messi: " + ", ".join(d) + (" — mancano: " + ", ".join(mancano) if mancano else ""))
          PY
          npx --yes wrangler@4.149.0 secret bulk /tmp/segreti.json 2>&1 | tail -5
          rm -f /tmp/segreti.json

      - name: il bot punta alla porta
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ]; then echo "::notice::niente bot ancora: le risposte restano solo nell'archivio"; exit 0; fi
          SEG=$(printf '%s' "$TG_BOT_TOKEN" | sha256sum | cut -c1-32)
          R=$(curl -s "https://api.telegram.org/bot${TG_BOT_TOKEN}/setWebhook" \
                --data-urlencode "url=https://jjavis-porta.19-jjardito93.workers.dev/telegram" \
                --data-urlencode "secret_token=${SEG}" \
                --data-urlencode 'allowed_updates=["message","callback_query"]')
          echo "$R" | grep -q '"ok":true' && echo "::notice::webhook del bot a posto" || { echo "::error::setWebhook: $R"; exit 1; }
