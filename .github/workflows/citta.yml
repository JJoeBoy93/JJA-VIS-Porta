# Consegna del server della città di JJA-VIS (worker jjavis-citta, cartella citta/): in città insieme agli altri.
# JJ, 5/10: «non è una piazza... è la città».
# Prima la prova contro workerd: se non è verde, non si consegna.
# Va sull'account Cloudflare di JJA-VIS, non su quello di Hermes e Clio (JJ, 5/10:
# «se mettiamo troppe cose insieme poi usano tutti gli stessi contatori»).
#   JJAVIS_CF_TOKEN  token dell'account JJA-VIS, modello «Edit Cloudflare Workers»   da mettere (JJ)
#   CF_AI_ACCOUNT    l'ID dell'account JJA-VIS: c'è già, è quello di Nova
# La prima volta l'account deve avere il suo sottodominio workers.dev (dashboard →
# Workers & Pages): se manca, la consegna lo dice nell'errore.
name: consegna città

on:
  push:
    branches: [main]
    paths: ["citta/**", ".github/workflows/citta.yml"]
  workflow_dispatch:

jobs:
  consegna:
    runs-on: ubuntu-24.04   # 5/10: con ubuntu-latest le macchine non arrivavano (annullate dopo 15 min)
    defaults:
      run:
        working-directory: citta
    steps:
      - uses: actions/checkout@v5

      - name: la prova, contro workerd
        run: |
          set -o pipefail
          npm i --no-save --silent wrangler@4 ws@8
          (npx wrangler dev --port 8799 --ip 127.0.0.1 --local > dev.log 2>&1 &)
          for i in $(seq 1 60); do sleep 2; curl -s http://127.0.0.1:8799/ > /dev/null && break; done
          node collaudo.mjs | tee prova.log
          tail -1 prova.log | grep -qx VERDE || { echo "::error::la prova del server della città non è verde: niente consegna"; exit 1; }

      - name: il sottodominio workers.dev dell'account
        # la prima consegna del 5/10 è caduta qui: l'account JJA-VIS non ne aveva uno. Se manca lo crea
        # (API «Create Subdomain», permesso Workers Scripts Write: è nel token). Prova i nomi in ordine
        env:
          T: ${{ secrets.JJAVIS_CF_TOKEN }}
          A: ${{ secrets.CF_AI_ACCOUNT }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then echo "::warning::niente token o account: salto"; exit 0; fi
          API="https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain"
          leggi() { python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or {}).get("subdomain") or "")'; }
          S=$(curl -s -H "Authorization: Bearer $T" "$API" | leggi)
          if [ -n "$S" ]; then echo "::notice::sottodominio dell'account: $S.workers.dev"; exit 0; fi
          for N in jjavis jja-vis jjavis-citta; do
            R=$(curl -s -X PUT -H "Authorization: Bearer $T" -H "Content-Type: application/json" --data "{\"subdomain\":\"$N\"}" "$API")
            S=$(echo "$R" | leggi)
            if [ -n "$S" ]; then echo "::notice::sottodominio creato: $S.workers.dev"; exit 0; fi
            echo "::warning::$N non va: $(echo "$R" | head -c 300)"
          done
          echo "::error::nessun sottodominio creato: va scelto a mano nella dashboard (Workers & Pages)"; exit 1

      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.JJAVIS_CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_AI_ACCOUNT }}
        run: |
          set -o pipefail
          # senza token il server non si consegna: lo dice forte nell'annotazione, ma non manda una mail di fallimento a ogni push
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::server della città NON consegnato: manca JJAVIS_CF_TOKEN nei Secrets del repository (token dell'account JJA-VIS, modello «Edit Cloudflare Workers»). Messo il token: Actions → consegna città → Run workflow"; exit 0; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::manca CF_AI_ACCOUNT (l'ID dell'account JJA-VIS)"; exit 1; fi
          if npx --yes wrangler@4 deploy 2>&1 | tee consegna.log; then
            # l'indirizzo vero del server: va in JJA-VIS/insieme.json, da cui la città lo legge
            echo "::notice::città consegnata: $(grep -o 'https://jjavis-citta[^ ]*workers.dev' consegna.log | head -1)"
            echo "::notice::$(tail -c 500 consegna.log | tr '\n' '|')"
          else
            echo "::error::$(tail -c 900 consegna.log | tr '\n' '|')"
            exit 1
          fi
